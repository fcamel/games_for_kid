<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>馬桶拆除工程</title>
    <style>
      :root {
        --sky: #d8f3ff;
        --grass: #73c956;
        --grass-dark: #2f7f46;
        --toilet: #f8fbff;
        --toilet-shade: #cfdde9;
        --water: #79d1f4;
        --mole: #8d5b42;
        --mole-dark: #5c3828;
        --bomb: #2c3137;
        --flame: #ffb000;
        --sign: #fff5c6;
        --sign-border: #915f31;
        --text: #263238;
        --accent: #f25f4c;
        --accent-dark: #b9362d;
        --ok: #1f8f5f;
        --wrong: #da3d3d;
        --panel: rgba(255, 255, 255, 0.84);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          linear-gradient(180deg, var(--sky) 0 42%, #c9ed9a 42% 100%);
        overflow-x: hidden;
      }

      button {
        font: inherit;
      }

      .game {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 10px;
        padding: clamp(10px, 2vw, 18px);
      }

      .topbar {
        width: min(1120px, 100%);
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
        border: 2px solid rgba(38, 50, 56, 0.08);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 8px 24px rgba(64, 92, 48, 0.16);
      }

      .title {
        margin: 0;
        font-size: clamp(18px, 2.3vw, 28px);
        line-height: 1.1;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .mode-switch {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.76);
        box-shadow: inset 0 0 0 2px rgba(38, 50, 56, 0.08);
      }

      .mode-button {
        border: 0;
        border-radius: 999px;
        padding: 9px 13px;
        color: var(--text);
        background: transparent;
        font-weight: 900;
        cursor: pointer;
        white-space: nowrap;
      }

      .mode-button.active {
        color: #ffffff;
        background: var(--accent);
        box-shadow: 0 3px 0 var(--accent-dark);
      }

      .progress {
        min-width: 84px;
        padding: 8px 10px;
        border-radius: 999px;
        background: #ffffff;
        text-align: center;
        font-weight: 800;
        box-shadow: inset 0 0 0 2px rgba(38, 50, 56, 0.1);
      }

      .restart {
        border: 0;
        border-radius: 999px;
        padding: 9px 13px;
        color: #ffffff;
        background: var(--grass-dark);
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 4px 0 #1e5130;
      }

      .restart:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #1e5130;
      }

      .field-wrap {
        width: min(1120px, 100%);
        margin: 0 auto;
        display: grid;
        align-items: center;
      }

      .field {
        position: relative;
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        grid-template-rows: repeat(3, minmax(170px, 1fr));
        gap: clamp(12px, 2vw, 24px);
        padding: clamp(10px, 2vw, 18px);
        border-radius: 8px;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.2) 1px, transparent 1px),
          linear-gradient(180deg, #d8f7ff 0 44%, #bfefff 44% 100%);
        background-size: 38px 38px, 100% 100%;
        border: 4px solid rgba(47, 127, 70, 0.4);
        box-shadow: inset 0 -18px 40px rgba(71, 126, 153, 0.22);
      }

      .center {
        grid-column: 2;
        grid-row: 2;
        display: grid;
        place-items: center;
        min-width: 0;
      }

      .play {
        width: min(154px, 100%);
        aspect-ratio: 1;
        border: 0;
        border-radius: 50%;
        color: #ffffff;
        background:
          radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.32), transparent 28%),
          linear-gradient(180deg, #ff7d62, var(--accent));
        box-shadow: 0 9px 0 var(--accent-dark), 0 16px 30px rgba(81, 49, 31, 0.26);
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
      }

      .play::before {
        content: "";
        width: 0;
        height: 0;
        border-top: 28px solid transparent;
        border-bottom: 28px solid transparent;
        border-left: 42px solid #ffffff;
        margin-left: 10px;
        filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.12));
      }

      .play:hover,
      .mole-btn:hover {
        filter: brightness(1.04);
      }

      .play:active {
        transform: translateY(5px);
        box-shadow: 0 4px 0 var(--accent-dark), 0 9px 18px rgba(81, 49, 31, 0.22);
      }

      .play.speaking {
        animation: pulse 760ms ease-in-out infinite;
      }

      .hole-cell {
        position: relative;
        min-width: 0;
        display: grid;
        align-items: end;
      }

      .hole {
        position: absolute;
        z-index: 0;
        left: 53%;
        bottom: 4px;
        width: min(192px, 98%);
        height: 104px;
        transform: translateX(-50%) rotate(-45deg);
        transform-origin: 42% 58%;
        border-radius: 18px 68px 34px 42px;
        background:
          radial-gradient(ellipse at 73% 35%, var(--water) 0 22%, #ffffff 23% 39%, transparent 40%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.96), var(--toilet-shade));
        border: 4px solid #9ab0c3;
        box-shadow:
          inset 0 -12px 0 rgba(75, 96, 116, 0.12),
          -24px 24px 0 -12px #c1d0dd,
          0 7px 0 rgba(76, 94, 110, 0.2);
      }

      .hole::before {
        content: "";
        position: absolute;
        left: -5%;
        bottom: 42%;
        width: 43%;
        height: 82px;
        border-radius: 12px 12px 18px 18px;
        background: linear-gradient(180deg, #ffffff, var(--toilet-shade));
        border: 4px solid #9ab0c3;
        box-shadow: inset 0 8px 0 rgba(255, 255, 255, 0.76);
      }

      .mole-btn {
        position: relative;
        z-index: 1;
        min-width: 0;
        height: 100%;
        border: 0;
        background: transparent;
        cursor: pointer;
        display: grid;
        place-items: end center;
        padding: 0;
        pointer-events: none;
      }

      .mole {
        position: relative;
        width: min(126px, 100%);
        height: min(122px, 100%);
        min-height: 98px;
        opacity: 0;
        transform: translateY(92px) scale(0.88);
        transition: transform 300ms ease, opacity 180ms ease;
      }

      .hole-cell.visible:not(.flying) .mole {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .hole-cell.visible:not(.flying) .mole-btn {
        pointer-events: auto;
      }

      .hole-cell.diving .mole {
        animation: dive-to-toilet 340ms ease-in forwards;
      }

      .face {
        position: absolute;
        z-index: 1;
        left: 18%;
        right: 18%;
        bottom: 12%;
        height: 68%;
        border-radius: 48% 48% 38% 38%;
        background:
          radial-gradient(circle at 35% 34%, #222 0 4px, transparent 5px),
          radial-gradient(circle at 65% 34%, #222 0 4px, transparent 5px),
          radial-gradient(ellipse at 50% 58%, #f0bea6 0 18%, transparent 19%),
          var(--mole);
        border: 3px solid var(--mole-dark);
      }

      .face::before,
      .face::after {
        content: "";
        position: absolute;
        top: -12%;
        width: 24%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--mole);
        border: 3px solid var(--mole-dark);
        z-index: -1;
      }

      .face::before {
        left: 7%;
      }

      .face::after {
        right: 7%;
      }

      .nose {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 10px;
        height: 7px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: #3b1e1b;
      }

      .bomb {
        position: absolute;
        z-index: 4;
        right: 3%;
        bottom: 31%;
        width: 28px;
        aspect-ratio: 1;
        border-radius: 50%;
        background:
          radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.38) 0 4px, transparent 5px),
          var(--bomb);
        border: 3px solid #15191d;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.22);
      }

      .bomb::before {
        content: "";
        position: absolute;
        left: 45%;
        bottom: 88%;
        width: 14px;
        height: 12px;
        border-top: 3px solid #15191d;
        border-right: 3px solid #15191d;
        border-radius: 0 9px 0 0;
        transform: rotate(-16deg);
      }

      .bomb::after {
        content: "";
        position: absolute;
        left: 95%;
        bottom: 116%;
        width: 10px;
        aspect-ratio: 1;
        border-radius: 50% 50% 50% 0;
        background: var(--flame);
        transform: rotate(-28deg);
        box-shadow: 0 0 8px rgba(255, 176, 0, 0.8);
      }

      .sign {
        position: absolute;
        z-index: 3;
        left: 50%;
        top: 0;
        width: min(132px, 108%);
        min-height: 45px;
        transform: translateX(-50%) rotate(-2deg);
        display: grid;
        place-items: center;
        padding: 7px 8px;
        border: 3px solid var(--sign-border);
        border-radius: 6px;
        background: var(--sign);
        color: #2b2216;
        font-weight: 850;
        line-height: 1.05;
        text-align: center;
        box-shadow: 0 4px 0 rgba(81, 49, 31, 0.22);
        word-break: normal;
        overflow-wrap: anywhere;
      }

      .sign::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -32px;
        width: 8px;
        height: 32px;
        transform: translateX(-50%);
        background: var(--sign-border);
        z-index: -1;
      }

      .sign-text {
        position: relative;
        z-index: 2;
        font-size: clamp(11px, 1.3vw, 16px);
      }

      .hole-cell.flying .mole-btn {
        pointer-events: none;
      }

      .hole-cell.exploding .mole {
        animation: toilet-drop 900ms cubic-bezier(0.35, 0.02, 0.28, 1) forwards;
      }

      .hole-cell.exploding .hole {
        animation: toilet-destroy 900ms ease-out forwards;
      }

      .hole-cell.exploding::before {
        content: "";
        position: absolute;
        z-index: 6;
        left: 50%;
        bottom: 18%;
        width: 28px;
        aspect-ratio: 1;
        border-radius: 50%;
        background:
          radial-gradient(circle, #ffffff 0 14%, transparent 15%),
          radial-gradient(circle, #ffe66b 0 30%, transparent 31%),
          radial-gradient(circle, #ff8c1a 0 52%, transparent 53%),
          radial-gradient(circle, #d72626 0 68%, transparent 69%);
        animation: blast 900ms ease-out forwards;
      }

      .hole-cell.wrong .sign {
        background: #ffd2d2;
        border-color: var(--wrong);
        animation: shake 260ms ease-in-out;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        padding: 20px;
        background: rgba(19, 48, 32, 0.45);
        z-index: 10;
      }

      .overlay.show {
        display: grid;
      }

      .finish {
        width: min(420px, 100%);
        padding: 24px;
        border-radius: 8px;
        background: #ffffff;
        text-align: center;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
      }

      .finish h2 {
        margin: 0 0 10px;
        font-size: clamp(28px, 6vw, 44px);
      }

      .finish p {
        margin: 0 0 18px;
        font-size: 18px;
        font-weight: 700;
      }

      .finish button {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        color: #ffffff;
        background: var(--accent);
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 5px 0 var(--accent-dark);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      @keyframes toilet-drop {
        0% {
          opacity: 1;
          transform: translateY(0) rotate(0deg) scale(1);
        }
        58% {
          opacity: 1;
          transform: translateY(56px) rotate(-6deg) scale(0.94);
        }
        100% {
          opacity: 0;
          transform: translateY(86px) rotate(14deg) scale(0.62);
        }
      }

      @keyframes dive-to-toilet {
        0% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(92px) scale(0.82);
        }
      }

      @keyframes toilet-destroy {
        0% {
          opacity: 1;
          transform: translateX(-50%) rotate(-45deg) scale(1);
        }
        58% {
          opacity: 1;
          transform: translateX(-50%) rotate(-45deg) scale(1.04);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) rotate(-37deg) scale(0.72);
        }
      }

      @keyframes blast {
        0% {
          opacity: 0;
          transform: translateX(-50%) scale(0.2);
        }
        48% {
          opacity: 0;
          transform: translateX(-50%) scale(0.2);
        }
        70% {
          opacity: 1;
          transform: translateX(-50%) scale(3.1);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) scale(4.2);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(-50%) rotate(-2deg);
        }
        25% {
          transform: translateX(calc(-50% - 6px)) rotate(-5deg);
        }
        75% {
          transform: translateX(calc(-50% + 6px)) rotate(2deg);
        }
      }

      @media (max-width: 720px) {
        .game {
          padding: 8px;
        }

        .topbar {
          align-items: stretch;
          flex-direction: column;
          gap: 8px;
        }

        .status {
          justify-content: space-between;
        }

        .mode-switch {
          justify-content: center;
          width: 100%;
        }

        .mode-button {
          flex: 1;
          min-width: 0;
          padding: 9px 8px;
          font-size: clamp(12px, 3.3vw, 15px);
        }

        .field {
          grid-template-columns: repeat(3, minmax(72px, 1fr));
          grid-template-rows: repeat(3, minmax(124px, 1fr));
          gap: 8px;
          padding: 8px;
        }

        .hole {
          height: 82px;
          width: min(132px, 100%);
          border-width: 3px;
        }

        .hole::before {
          height: 55px;
          border-width: 3px;
        }

        .play {
          width: min(76px, 100%);
        }

        .play::before {
          border-top-width: 17px;
          border-bottom-width: 17px;
          border-left-width: 26px;
          margin-left: 6px;
        }

        .mole {
          min-height: 78px;
        }

        .face {
          left: 15%;
          right: 15%;
        }

        .sign {
          min-height: 37px;
          padding: 5px;
          border-width: 2px;
        }

        .sign::after {
          bottom: -24px;
          height: 24px;
          width: 6px;
        }

        .sign-text {
          font-size: clamp(8px, 2.2vw, 11px);
        }

      }
    </style>
  </head>
  <body>
    <main class="game" aria-label="英文短句馬桶拆除遊戲">
      <header class="topbar">
        <h1 class="title">馬桶拆除工程</h1>
        <div class="mode-switch" role="group" aria-label="選擇遊戲模式">
          <button class="mode-button active" type="button" data-mode="englishToChinese">念英文找中文</button>
          <button class="mode-button" type="button" data-mode="chineseToEnglish">念中文找英文</button>
        </div>
        <div class="status">
          <div class="progress" id="progress">0 / 20</div>
          <button class="restart" id="restart" type="button">重新開始</button>
        </div>
      </header>

      <section class="field-wrap">
        <div class="field" id="field" aria-live="polite">
          <div class="center">
            <button class="play" id="play" type="button" aria-label="播放英文提示"></button>
          </div>
        </div>
      </section>
    </main>

    <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="finish-title">
      <div class="finish">
        <h2 id="finish-title">全部完成！</h2>
        <p>20 個短句都答對，馬桶拆除工程完成。</p>
        <button id="play-again" type="button">再玩一次</button>
      </div>
    </div>

    <script>
      const phrases = [
        { id: 1, english: "Great.", chinese: "太棒了！" },
        { id: 2, english: "Come in, please.", chinese: "請進。" },
        { id: 3, english: "Come here.", chinese: "過來。" },
        { id: 4, english: "Follow me.", chinese: "跟我來。" },
        { id: 5, english: "Look here.", chinese: "看這裡。" },
        { id: 6, english: "Listen to me.", chinese: "聽我說。" },
        { id: 7, english: "Be quiet, please.", chinese: "請安靜。" },
        { id: 8, english: "Hurry up.", chinese: "快一點。" },
        { id: 9, english: "Take out your book.", chinese: "拿出你的書。" },
        { id: 10, english: "Put away your book.", chinese: "把書收起來。" },
        { id: 11, english: "Repeat after me.", chinese: "跟我唸。" },
        { id: 12, english: "Let's read.", chinese: "我們來讀。" },
        { id: 13, english: "Let's go to _____.", chinese: "我們去_____。" },
        { id: 14, english: "Time to go home.", chinese: "該回家了。" },
        { id: 15, english: "See you.", chinese: "再見。" },
        { id: 16, english: "Bless you.", chinese: "保重。（別人打噴嚏時說）" },
        { id: 17, english: "I'm fine.", chinese: "我很好。" },
        { id: 18, english: "How are you?", chinese: "你好嗎？" },
        { id: 19, english: "Nice to meet you.", chinese: "很高興認識你。" },
        { id: 20, english: "Let me help you.", chinese: "讓我幫你。" }
      ];

      const field = document.querySelector("#field");
      const playButton = document.querySelector("#play");
      const modeButtons = document.querySelectorAll(".mode-button");
      const restartButton = document.querySelector("#restart");
      const playAgainButton = document.querySelector("#play-again");
      const progress = document.querySelector("#progress");
      const overlay = document.querySelector("#overlay");
      const gameModes = {
        englishToChinese: {
          promptKey: "english",
          choiceKey: "chinese",
          lang: "en-US",
          rate: 0.86,
          playLabel: "播放英文提示",
          finishText: "全部完成！"
        },
        chineseToEnglish: {
          promptKey: "chinese",
          choiceKey: "english",
          lang: "zh-TW",
          rate: 0.88,
          playLabel: "播放中文提示",
          finishText: "全部完成！"
        }
      };
      const total = phrases.length;
      const toiletCount = 8;
      const activeMoles = 3;
      const diveDurationMs = 340;
      const cells = [];
      let order = [];
      let currentIndex = 0;
      let currentPhrase = null;
      let currentOptions = [];
      let phraseToken = 0;
      let activeMode = "englishToChinese";
      let completedIds = new Set();
      let wrongTimer = null;
      let moleControllers = [];
      let movementStarted = false;
      let resolvingAnswer = false;
      let resetToken = 0;

      function shuffle(items) {
        const copy = [...items];
        for (let index = copy.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
        }
        return copy;
      }

      function randomBetween(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function getHolePosition(index) {
        const positions = [
          [1, 1], [2, 1], [3, 1],
          [1, 2], [3, 2],
          [1, 3], [2, 3], [3, 3]
        ];
        return positions[index];
      }

      function createHole(index) {
        const [column, row] = getHolePosition(index);
        const cell = document.createElement("div");
        cell.className = "hole-cell";
        cell.style.gridColumn = column;
        cell.style.gridRow = row;
        cell.style.setProperty("--move-delay", `${index * -170}ms`);
        cell.dataset.id = "";

        const hole = document.createElement("div");
        hole.className = "hole";

        const button = document.createElement("button");
        button.className = "mole-btn";
        button.type = "button";
        button.setAttribute("aria-label", "");

        const mole = document.createElement("div");
        mole.className = "mole";

        const sign = document.createElement("div");
        sign.className = "sign";

        const signText = document.createElement("span");
        signText.className = "sign-text";
        signText.textContent = "";

        const face = document.createElement("div");
        face.className = "face";

        const nose = document.createElement("span");
        nose.className = "nose";

        const bomb = document.createElement("span");
        bomb.className = "bomb";

        face.append(nose);
        sign.append(signText);
        mole.append(sign, face, bomb);
        button.append(mole);
        cell.append(hole, button);

        button.addEventListener("click", () => choosePhrase(Number(cell.dataset.id), cell));
        field.append(cell);
        cells.push(cell);
      }

      function getActiveMode() {
        return gameModes[activeMode];
      }

      function getPhraseForCell(cell) {
        const id = Number(cell.dataset.id);
        return phrases.find((phrase) => phrase.id === id);
      }

      function getDisplayPhraseOptions() {
        if (!currentPhrase) {
          return [];
        }

        const distractors = shuffle(phrases.filter((phrase) => phrase.id !== currentPhrase.id));
        return shuffle([currentPhrase, ...distractors.slice(0, toiletCount - 1)]);
      }

      function getSpeechText(phrase) {
        const mode = getActiveMode();
        const text = phrase[mode.promptKey];
        return mode.lang === "en-US" ? text.replaceAll("_", " blank ") : text;
      }

      function updateModeButtons() {
        playButton.setAttribute("aria-label", getActiveMode().playLabel);
        modeButtons.forEach((button) => {
          const isActive = button.dataset.mode === activeMode;
          button.classList.toggle("active", isActive);
          button.setAttribute("aria-pressed", String(isActive));
        });
      }

      function updateCellText() {
        const mode = getActiveMode();
        cells.forEach((cell) => {
          const phrase = getPhraseForCell(cell);
          if (!phrase) {
            return;
          }
          const choiceText = phrase[mode.choiceKey];
          cell.querySelector(".sign-text").textContent = choiceText;
          cell.querySelector(".mole-btn").setAttribute("aria-label", choiceText);
        });
      }

      function setMode(modeKey) {
        if (!gameModes[modeKey] || modeKey === activeMode) {
          return;
        }

        activeMode = modeKey;
        updateModeButtons();
        updateCellText();
        resetGame();
      }

      function speak(text, speechOptions = {}) {
        if (!("speechSynthesis" in window)) {
          playButton.classList.remove("speaking");
          return;
        }

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        const mode = getActiveMode();
        utterance.lang = speechOptions.lang || mode.lang;
        utterance.rate = speechOptions.rate || mode.rate;
        utterance.pitch = 1.05;
        utterance.onend = () => playButton.classList.remove("speaking");
        utterance.onerror = () => playButton.classList.remove("speaking");
        playButton.classList.add("speaking");
        window.speechSynthesis.speak(utterance);
      }

      function updateProgress() {
        progress.textContent = `${completedIds.size} / ${total}`;
      }

      function stopMovementTimers() {
        clearMoleTimers();
      }

      function startMovement() {
        stopMovementTimers();
        movementStarted = true;
        field.classList.add("moving");
        startMoleMovement();
      }

      function pickActiveCellIndexes() {
        const answerIndex = cells.findIndex((cell) => Number(cell.dataset.id) === currentPhrase.id);
        const otherIndexes = cells
          .map((cell, index) => index)
          .filter((index) => index !== answerIndex);
        return shuffle([answerIndex, ...shuffle(otherIndexes).slice(0, activeMoles - 1)]);
      }

      function clearMoleTimers() {
        moleControllers.forEach((controller) => {
          window.clearTimeout(controller.timer);
          controller.timer = null;
        });
      }

      function showMoleControllers() {
        const occupiedIndexes = new Set(
          moleControllers
            .map((controller) => controller.cellIndex)
            .filter((index) => index !== null)
        );

        cells.forEach((cell, index) => {
          const isVisible = occupiedIndexes.has(index);
          cell.classList.toggle("occupied", isVisible);
          cell.classList.toggle("visible", isVisible);
          cell.classList.remove("diving");
        });
      }

      function startStaticMoles() {
        clearMoleTimers();
        moleControllers = pickActiveCellIndexes().map((cellIndex, index) => ({
          id: index,
          cellIndex,
          timer: null
        }));
        showMoleControllers();
      }

      function getAvailableToiletIndexes(currentIndex) {
        const occupiedIndexes = new Set(
          moleControllers
            .map((controller) => controller.cellIndex)
            .filter((index) => index !== null)
        );

        return cells
          .map((cell, index) => index)
          .filter((index) => index !== currentIndex && !occupiedIndexes.has(index));
      }

      function chooseNextToiletIndex(currentIndex) {
        const availableIndexes = getAvailableToiletIndexes(currentIndex);
        if (availableIndexes.length === 0) {
          return currentIndex;
        }

        const answerIndex = cells.findIndex((cell) => Number(cell.dataset.id) === currentPhrase.id);
        const answerIsAvailable = availableIndexes.includes(answerIndex);
        if (answerIsAvailable && Math.random() < 0.42) {
          return answerIndex;
        }

        return availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
      }

      function scheduleMoleMove(controller, delay) {
        window.clearTimeout(controller.timer);
        controller.timer = window.setTimeout(() => moveMole(controller), delay);
      }

      function scheduleMoleOut(controller, delay) {
        window.clearTimeout(controller.timer);
        controller.timer = window.setTimeout(() => moveMoleOut(controller), delay);
      }

      function moveMole(controller) {
        if (!currentPhrase || resolvingAnswer || !movementStarted) {
          return;
        }

        const token = resetToken;
        const roundToken = phraseToken;
        const currentCellIndex = controller.cellIndex;
        const currentCell = cells[currentCellIndex];
        if (!currentCell) {
          return;
        }

        currentCell.classList.add("diving");
        currentCell.classList.remove("visible");

        window.setTimeout(() => {
          if (token !== resetToken || roundToken !== phraseToken || !currentPhrase || resolvingAnswer || !movementStarted) {
            return;
          }

          currentCell.classList.remove("diving", "occupied");
          controller.cellIndex = null;
          const hiddenDelay = randomBetween(1000, 3000);

          scheduleMoleOut(controller, hiddenDelay);
        }, diveDurationMs);
      }

      function startMoleMovement() {
        clearMoleTimers();
        showMoleControllers();
        moleControllers.forEach((controller, index) => {
          const firstDelay = 650 + index * 720 + randomBetween(0, 420);
          scheduleMoleMove(controller, firstDelay);
        });
      }

      function moveMoleOut(controller) {
        if (!currentPhrase || resolvingAnswer || !movementStarted) {
          return;
        }

        const nextIndex = chooseNextToiletIndex(controller.cellIndex);
        controller.cellIndex = nextIndex;
        const nextCell = cells[nextIndex];
        nextCell.classList.remove("diving");
        nextCell.classList.add("occupied", "visible");

        const visibleDelay = randomBetween(1200, 2800) + controller.id * 260;
        scheduleMoleMove(controller, visibleDelay);
      }

      function setCurrentPhrase() {
        clearMoleTimers();
        phraseToken += 1;
        currentPhrase = order[currentIndex] || null;
        currentOptions = getDisplayPhraseOptions();
        cells.forEach((cell, index) => {
          const phrase = currentOptions[index];
          cell.dataset.id = phrase ? String(phrase.id) : "";
          cell.classList.remove("correct", "wrong", "flying", "exploding", "target", "visible", "occupied", "diving");
          cell.classList.toggle("target", Boolean(currentPhrase && phrase && phrase.id === currentPhrase.id));
        });
        updateCellText();
        if (currentPhrase) {
          startStaticMoles();
        }
      }

      function playCurrentPhrase() {
        if (!currentPhrase) {
          return;
        }

        speak(getSpeechText(currentPhrase));
      }

      function choosePhrase(id, cell) {
        if (!currentPhrase || resolvingAnswer) {
          return;
        }

        if (!cell || !id || !cell.classList.contains("visible") || cell.classList.contains("diving")) {
          return;
        }

        if (id !== currentPhrase.id) {
          clearTimeout(wrongTimer);
          cell.classList.add("wrong");
          wrongTimer = window.setTimeout(() => cell.classList.remove("wrong"), 320);
          speak(getSpeechText(currentPhrase));
          return;
        }

        resolvingAnswer = true;
        const token = resetToken;
        clearMoleTimers();
        completedIds.add(id);
        cell.classList.remove("target", "wrong", "diving");
        cell.classList.add("correct", "flying", "exploding");
        updateProgress();

        if (completedIds.size === total) {
          window.setTimeout(() => {
            if (token === resetToken) {
              finishGame();
            }
          }, 900);
          return;
        }

        window.setTimeout(() => {
          if (token !== resetToken) {
            return;
          }

          currentIndex += 1;
          resolvingAnswer = false;
          setCurrentPhrase();
          if (movementStarted) {
            startMoleMovement();
          }
          window.setTimeout(playCurrentPhrase, 300);
        }, 900);
      }

      function finishGame() {
        currentPhrase = null;
        resolvingAnswer = false;
        stopMovementTimers();
        field.classList.remove("moving");
        playButton.classList.remove("speaking");
        cells.forEach((cell) => cell.classList.remove("target", "wrong", "flying", "exploding", "visible", "occupied", "diving"));
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          speak(getActiveMode().finishText, { lang: "zh-TW", rate: 0.88 });
        }
        overlay.classList.add("show");
      }

      function resetGame() {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }

        resetToken += 1;
        resolvingAnswer = false;
        movementStarted = false;
        field.classList.remove("moving");
        currentOptions = [];
        completedIds = new Set();
        currentIndex = 0;
        order = shuffle(phrases);
        overlay.classList.remove("show");
        playButton.classList.remove("speaking");
        cells.forEach((cell) => {
          cell.classList.remove("correct", "wrong", "target", "flying", "exploding", "visible", "occupied", "diving");
        });
        updateProgress();
        setCurrentPhrase();
        startMovement();
      }

      for (let index = 0; index < toiletCount; index += 1) {
        createHole(index);
      }
      updateModeButtons();
      updateCellText();
      resetGame();

      playButton.addEventListener("click", playCurrentPhrase);
      modeButtons.forEach((button) => {
        button.addEventListener("click", () => setMode(button.dataset.mode));
      });
      restartButton.addEventListener("click", resetGame);
      playAgainButton.addEventListener("click", resetGame);

      document.addEventListener("keydown", (event) => {
        if (event.code === "Space" && !event.repeat) {
          event.preventDefault();
          playCurrentPhrase();
        }

        if (event.key === "Enter" && overlay.classList.contains("show")) {
          resetGame();
        }
      });
    </script>
  </body>
</html>
