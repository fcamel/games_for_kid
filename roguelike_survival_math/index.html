<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Grizzy 數學大冒險</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Fredoka+One&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { 
    width: 100%; height: 100%; overflow: hidden; 
    background: #1a1a2e; 
    font-family: 'Noto Sans TC', sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  canvas { display: block; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px;
    background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
    z-index: 10; pointer-events: none;
  }
  #hearts { font-size: 28px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
  #score-display {
    font-family: 'Fredoka One', cursive;
    font-size: 20px; color: #ffd700;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  #score-display span { display: block; font-size: 14px; color: #aaa; font-family: 'Noto Sans TC'; }

  #joystick-zone {
    position: fixed; bottom: 20px; left: 20px;
    width: 160px; height: 160px;
    z-index: 20;
  }
  #joystick-base {
    width: 130px; height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 100%);
    border: 2px solid rgba(255,255,255,0.15);
    position: absolute; bottom: 10px; left: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  #joystick-knob {
    width: 54px; height: 54px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.35), rgba(255,255,255,0.1));
    border: 2px solid rgba(255,255,255,0.25);
    position: absolute;
    transition: none;
  }

  #quiz-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(4px);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 50;
  }
  #quiz-overlay.active { display: flex; }

  #quiz-box {
    background: linear-gradient(145deg, #2d2d5e, #1a1a3e);
    border: 3px solid #5c5cff;
    border-radius: 24px;
    padding: 30px 36px;
    text-align: center;
    box-shadow: 0 0 40px rgba(92, 92, 255, 0.3), inset 0 1px 0 rgba(255,255,255,0.1);
    max-width: 360px; width: 90%;
    animation: quizPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #quiz-box.red-enemy {
    border-color: #ff4444;
    box-shadow: 0 0 40px rgba(255, 68, 68, 0.3), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  #quiz-box.bomb-quiz {
    border-color: #ffaa00;
    box-shadow: 0 0 50px rgba(255, 170, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    background: linear-gradient(145deg, #3d2d10, #2a1a08);
  }
  @keyframes quizPop {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  #quiz-question {
    font-family: 'Fredoka One', cursive;
    font-size: 44px; color: #fff;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(92, 92, 255, 0.5);
  }
  #quiz-label {
    font-size: 13px; margin-bottom: 4px; font-weight: 700;
  }
  #quiz-instruction {
    font-size: 14px; color: #aab; margin-bottom: 22px;
  }
  #quiz-answers {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .quiz-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 28px; color: #fff;
    background: linear-gradient(145deg, #3a3a7a, #25254f);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 14px 0;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .quiz-btn:active {
    transform: scale(0.92);
    background: linear-gradient(145deg, #5c5cff, #3a3a7a);
  }
  .quiz-btn.correct {
    background: linear-gradient(145deg, #2ecc71, #1a9d55) !important;
    border-color: #2ecc71 !important;
    animation: btnFlash 0.4s;
  }
  .quiz-btn.wrong {
    background: linear-gradient(145deg, #e74c3c, #a93226) !important;
    border-color: #e74c3c !important;
    animation: btnShake 0.4s;
  }
  @keyframes btnFlash { 50% { transform: scale(1.1); } }
  @keyframes btnShake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #quiz-feedback {
    font-size: 22px; margin-top: 16px; height: 30px;
    font-weight: 700;
  }

  #screen-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, #1a1a3e 0%, #0d0d1a 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100;
    transition: opacity 0.5s;
  }
  #screen-overlay.hidden { opacity: 0; pointer-events: none; }
  #screen-title {
    font-family: 'Fredoka One', cursive;
    font-size: 32px; color: #ffd700;
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
    margin-bottom: 12px;
  }
  #screen-subtitle { font-size: 16px; color: #aab; margin-bottom: 10px; }
  #screen-stats {
    font-size: 18px; color: #ddd; margin-bottom: 24px;
    line-height: 1.8; text-align: center;
  }
  #screen-stats .big {
    font-family: 'Fredoka One', cursive;
    font-size: 44px; color: #ffd700;
    display: block;
    text-shadow: 0 0 20px rgba(255,215,0,0.3);
  }
  #start-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 24px; color: #fff;
    background: linear-gradient(145deg, #5c5cff, #3a3ab0);
    border: none; border-radius: 50px;
    padding: 16px 48px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(92,92,255,0.4);
    -webkit-tap-highlight-color: transparent;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); box-shadow: 0 4px 30px rgba(92,92,255,0.6); }
  }
  #start-btn:active { transform: scale(0.95); }
  #char-preview {
    font-size: 80px; margin-bottom: 20px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div id="hearts">❤️❤️❤️</div>
  <div id="score-display">
    <span>分數</span>
    <div id="score-value">0</div>
  </div>
</div>

<div id="joystick-zone">
  <div id="joystick-base">
    <div id="joystick-knob"></div>
  </div>
</div>

<div id="quiz-overlay">
  <div id="quiz-box">
    <div id="quiz-label"></div>
    <div id="quiz-question">3 + 5 = ?</div>
    <div id="quiz-instruction">點擊正確答案</div>
    <div id="quiz-answers"></div>
    <div id="quiz-feedback"></div>
  </div>
</div>

<div id="screen-overlay">
  <div id="char-preview">🐻</div>
  <div id="screen-title">Grizzy 數學大冒險</div>
  <div id="screen-subtitle">趕走搗蛋的小乐明，用數學保護你的家！</div>
  <div id="screen-stats"></div>
  <button id="start-btn">開始遊戲</button>
</div>

<script>
const TILE = 48;
const MAP_W = 60, MAP_H = 60;
const WORLD_W = MAP_W * TILE, WORLD_H = MAP_H * TILE;
const PLAYER_SIZE = 48;
const ENEMY_SIZE = 30;
const PLAYER_SPEED = 4;
const ENEMY_SPEED_BASE = 1.2;
const RED_ENEMY_SPEED = 1.5;
const SPAWN_INTERVAL_START = 3000;
const SPAWN_INTERVAL_MIN = 800;
const SPAWN_RAMP = 0.97;

const RED_SCHEDULE = [1/6, 1/5, 1/4, 1/3, 1/2, 1.0];

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hudHearts = document.getElementById('hearts');
const scoreValue = document.getElementById('score-value');
const quizOverlay = document.getElementById('quiz-overlay');
const quizBox = document.getElementById('quiz-box');
const quizLabel = document.getElementById('quiz-label');
const quizQuestion = document.getElementById('quiz-question');
const quizAnswers = document.getElementById('quiz-answers');
const quizFeedback = document.getElementById('quiz-feedback');
const screenOverlay = document.getElementById('screen-overlay');
const screenTitle = document.getElementById('screen-title');
const screenSubtitle = document.getElementById('screen-subtitle');
const screenStats = document.getElementById('screen-stats');
const startBtn = document.getElementById('start-btn');
const joystickZone = document.getElementById('joystick-zone');
const joystickBase = document.getElementById('joystick-base');
const joystickKnob = document.getElementById('joystick-knob');

let state = 'menu';
let player = { x: WORLD_W/2, y: WORLD_H/2, dir: 0 };
let enemies = [];
let hearts = 3;
let score = 0;
let killCount = 0;
let startTime = 0;
let survivalTime = 0;
let spawnInterval = SPAWN_INTERVAL_START;
let lastSpawn = 0;
let currentEnemy = null;
let quizAnswer = 0;
let joystickDir = { x: 0, y: 0 };
let joystickActive = false;
let joystickTouchId = null;
let cameraX = 0, cameraY = 0;
let animFrame = 0;

// Bomb system
let bombs = [];
let lastBombSpawn = 0;
let firstBombSpawned = false;
const BOMB_SIZE = 22;
const BOMB_FIRST_DELAY = 10000;   // first bomb at 10s
const BOMB_INTERVAL = 20000;      // then every 20s

// Explosion effect
let explosion = null; // { startTime, duration, x, y }
let currentBomb = null; // bomb being quizzed
let bombQuizAnswer = 0;

// ============ CABIN FLOOR TILES ============
const tileColors = [];
for (let y = 0; y < MAP_H; y++) {
  tileColors[y] = [];
  for (let x = 0; x < MAP_W; x++) {
    // Wooden floor pattern
    const r = Math.random();
    if ((x + y) % 2 === 0) {
      tileColors[y][x] = r < 0.5 ? '#a0845c' : '#96784e';
    } else {
      tileColors[y][x] = r < 0.5 ? '#8c7044' : '#b09068';
    }
  }
}

const decorations = [];
for (let i = 0; i < 100; i++) {
  const t = Math.random();
  let type, color, size;
  if (t < 0.3) {
    type = 'knot'; color = '#7a6038'; size = 3 + Math.random() * 4;
  } else if (t < 0.55) {
    type = 'scratch'; color = '#6a5530'; size = 8 + Math.random() * 15;
  } else if (t < 0.75) {
    type = 'nutella'; color = '#5C3317'; size = 4 + Math.random() * 3;
  } else {
    type = 'crumb'; color = '#d4b896'; size = 2 + Math.random() * 2;
  }
  decorations.push({ x: Math.random() * WORLD_W, y: Math.random() * WORLD_H, type, color, size });
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ============ DRAW MAP (Cabin wooden floor) ============
function drawMap() {
  const startCol = Math.max(0, Math.floor(cameraX / TILE));
  const endCol = Math.min(MAP_W, Math.ceil((cameraX + canvas.width) / TILE) + 1);
  const startRow = Math.max(0, Math.floor(cameraY / TILE));
  const endRow = Math.min(MAP_H, Math.ceil((cameraY + canvas.height) / TILE) + 1);

  for (let y = startRow; y < endRow; y++) {
    for (let x = startCol; x < endCol; x++) {
      ctx.fillStyle = tileColors[y][x];
      ctx.fillRect(x * TILE - cameraX, y * TILE - cameraY, TILE + 1, TILE + 1);
      // Wood grain line
      ctx.strokeStyle = 'rgba(0,0,0,0.06)';
      ctx.lineWidth = 0.5;
      const tx = x * TILE - cameraX;
      const ty = y * TILE - cameraY;
      ctx.beginPath();
      ctx.moveTo(tx, ty + TILE * 0.3);
      ctx.lineTo(tx + TILE, ty + TILE * 0.3);
      ctx.moveTo(tx, ty + TILE * 0.7);
      ctx.lineTo(tx + TILE, ty + TILE * 0.7);
      ctx.stroke();
    }
  }

  ctx.strokeStyle = '#5a4630';
  ctx.lineWidth = 8;
  ctx.strokeRect(-cameraX, -cameraY, WORLD_W, WORLD_H);

  for (const d of decorations) {
    const sx = d.x - cameraX, sy = d.y - cameraY;
    if (sx < -20 || sx > canvas.width + 20 || sy < -20 || sy > canvas.height + 20) continue;
    if (d.type === 'knot') {
      ctx.fillStyle = d.color;
      ctx.beginPath(); ctx.ellipse(sx, sy, d.size, d.size * 0.7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.ellipse(sx, sy, d.size * 1.3, d.size, 0, 0, Math.PI * 2); ctx.stroke();
    } else if (d.type === 'scratch') {
      ctx.strokeStyle = d.color; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + d.size, sy + d.size * 0.2); ctx.stroke();
    } else if (d.type === 'nutella') {
      // Yummy (Nutella) splat
      ctx.fillStyle = d.color; ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.ellipse(sx, sy, d.size, d.size * 0.6, Math.random(), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (d.type === 'crumb') {
      ctx.fillStyle = d.color;
      ctx.beginPath(); ctx.arc(sx, sy, d.size, 0, Math.PI * 2); ctx.fill();
    }
  }
}

// ============ DRAW GRIZZY ============
function drawGrizzy(x, y, size, dir) {
  const sx = x - cameraX, sy = y - cameraY;
  const s = size;
  const bounce = Math.sin(animFrame * 0.12) * 2;

  ctx.save();
  ctx.translate(sx, sy + bounce);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0, s*0.48, s*0.38, s*0.1, 0, 0, Math.PI*2); ctx.fill();

  // Body (big brown bear)
  ctx.fillStyle = '#6B3A1F';
  ctx.beginPath(); ctx.ellipse(0, s*0.05, s*0.36, s*0.42, 0, 0, Math.PI*2); ctx.fill();

  // Belly (light brown/tan)
  ctx.fillStyle = '#C49A6C';
  ctx.beginPath(); ctx.ellipse(0, s*0.12, s*0.24, s*0.28, 0, 0, Math.PI*2); ctx.fill();

  // Belly spot (lighter, like Grizzy's signature belly patch)
  ctx.fillStyle = '#D4AE7A';
  ctx.beginPath(); ctx.ellipse(0, s*0.08, s*0.15, s*0.18, 0, 0, Math.PI*2); ctx.fill();

  // Head
  ctx.fillStyle = '#6B3A1F';
  ctx.beginPath(); ctx.arc(0, -s*0.32, s*0.26, 0, Math.PI*2); ctx.fill();

  // Ears
  ctx.fillStyle = '#6B3A1F';
  ctx.beginPath(); ctx.arc(-s*0.2, -s*0.52, s*0.09, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(s*0.2, -s*0.52, s*0.09, 0, Math.PI*2); ctx.fill();
  // Inner ears
  ctx.fillStyle = '#C49A6C';
  ctx.beginPath(); ctx.arc(-s*0.2, -s*0.52, s*0.05, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(s*0.2, -s*0.52, s*0.05, 0, Math.PI*2); ctx.fill();

  // Muzzle
  ctx.fillStyle = '#C49A6C';
  ctx.beginPath(); ctx.ellipse(0, -s*0.24, s*0.14, s*0.1, 0, 0, Math.PI*2); ctx.fill();

  // Nose
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.ellipse(0, -s*0.27, s*0.05, s*0.035, 0, 0, Math.PI*2); ctx.fill();

  // Eyes
  const eyeOff = dir < 0 ? -2 : dir > 0 ? 2 : 0;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-s*0.1+eyeOff, -s*0.36, s*0.07, s*0.08, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s*0.1+eyeOff, -s*0.36, s*0.07, s*0.08, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(-s*0.08+eyeOff, -s*0.35, s*0.035, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(s*0.12+eyeOff, -s*0.35, s*0.035, 0, Math.PI*2); ctx.fill();
  // Eye shine
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-s*0.09+eyeOff, -s*0.37, s*0.012, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(s*0.11+eyeOff, -s*0.37, s*0.012, 0, Math.PI*2); ctx.fill();

  // Mouth
  ctx.strokeStyle = '#4a2a10';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, -s*0.22, s*0.06, 0.1, Math.PI-0.1); ctx.stroke();

  // Green locket (Grizzy's signature)
  ctx.fillStyle = '#3a8a3a';
  ctx.beginPath(); ctx.ellipse(0, -s*0.05, s*0.05, s*0.06, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#50b050';
  ctx.beginPath(); ctx.ellipse(0, -s*0.05, s*0.03, s*0.04, 0, 0, Math.PI*2); ctx.fill();

  // Arms
  const armWave = Math.sin(animFrame * 0.18) * 0.15;
  ctx.fillStyle = '#6B3A1F';
  ctx.save(); ctx.translate(-s*0.34, -s*0.02); ctx.rotate(-0.25+armWave);
  ctx.beginPath(); ctx.ellipse(0, 0, s*0.09, s*0.18, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(s*0.34, -s*0.02); ctx.rotate(0.25-armWave);
  ctx.beginPath(); ctx.ellipse(0, 0, s*0.09, s*0.18, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();

  // Feet
  ctx.fillStyle = '#5a3018';
  ctx.beginPath(); ctx.ellipse(-s*0.14, s*0.42, s*0.1, s*0.06, -0.1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s*0.14, s*0.42, s*0.1, s*0.06, 0.1, 0, Math.PI*2); ctx.fill();
  // Sandals (Grizzy wears the ranger's sandals)
  ctx.fillStyle = '#c8a060';
  ctx.beginPath(); ctx.ellipse(-s*0.14, s*0.44, s*0.11, s*0.04, -0.1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s*0.14, s*0.44, s*0.11, s*0.04, 0.1, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

// ============ DRAW LEMMING (enemy) ============
function drawLemming(e) {
  const sx = e.x - cameraX, sy = e.y - cameraY;
  if (sx < -60 || sx > canvas.width+60 || sy < -60 || sy > canvas.height+60) return;
  const s = ENEMY_SIZE;
  const hover = Math.sin(animFrame * 0.15 + e.phase) * 2;
  const isRed = e.type === 'red';

  // Normal lemming = blue body; Devil lemming = red body
  const bodyColor = isRed ? '#CC3333' : '#4A90D9';
  const bodyLight = isRed ? '#E86060' : '#7AB8F5';
  const bellyColor = isRed ? '#E8A0A0' : '#C8D8E8';

  ctx.save();
  ctx.translate(sx, sy + hover);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(0, s*0.48, s*0.3, s*0.08, 0, 0, Math.PI*2); ctx.fill();

  // Red glow
  if (isRed) { ctx.shadowColor = 'rgba(255,40,40,0.4)'; ctx.shadowBlur = 14; }

  // Body (small round blob)
  ctx.fillStyle = bodyColor;
  ctx.beginPath(); ctx.ellipse(0, s*0.05, s*0.3, s*0.38, 0, 0, Math.PI*2); ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

  // Belly
  ctx.fillStyle = bellyColor;
  ctx.beginPath(); ctx.ellipse(0, s*0.12, s*0.2, s*0.24, 0, 0, Math.PI*2); ctx.fill();

  // Head (big round)
  ctx.fillStyle = bodyColor;
  ctx.beginPath(); ctx.arc(0, -s*0.28, s*0.24, 0, Math.PI*2); ctx.fill();

  // Devil horns
  if (isRed) {
    ctx.fillStyle = '#880000';
    ctx.beginPath(); ctx.moveTo(-s*0.15, -s*0.45); ctx.lineTo(-s*0.25, -s*0.7); ctx.lineTo(-s*0.05, -s*0.48); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(s*0.15, -s*0.45); ctx.lineTo(s*0.25, -s*0.7); ctx.lineTo(s*0.05, -s*0.48); ctx.closePath(); ctx.fill();
  }

  // Eyes (big round lemming eyes)
  const dx = player.x - e.x, dy = player.y - e.y;
  const a = Math.atan2(dy, dx);
  const pd = 2;

  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-s*0.1, -s*0.3, s*0.1, s*0.12, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s*0.1, -s*0.3, s*0.1, s*0.12, 0, 0, Math.PI*2); ctx.fill();

  const pupilColor = isRed ? '#660000' : '#111';
  ctx.fillStyle = pupilColor;
  ctx.beginPath(); ctx.arc(-s*0.08+Math.cos(a)*pd, -s*0.3+Math.sin(a)*pd, s*0.05, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(s*0.12+Math.cos(a)*pd, -s*0.3+Math.sin(a)*pd, s*0.05, 0, Math.PI*2); ctx.fill();

  // Eye shine
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-s*0.1, -s*0.34, s*0.02, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(s*0.1, -s*0.34, s*0.02, 0, Math.PI*2); ctx.fill();

  // Angry eyebrows for devil
  if (isRed) {
    ctx.strokeStyle = '#660000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-s*0.18, -s*0.4); ctx.lineTo(-s*0.04, -s*0.38); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*0.18, -s*0.4); ctx.lineTo(s*0.04, -s*0.38); ctx.stroke();
  }

  // Nose
  ctx.fillStyle = isRed ? '#880000' : '#e07070';
  ctx.beginPath(); ctx.ellipse(0, -s*0.2, s*0.04, s*0.03, 0, 0, Math.PI*2); ctx.fill();

  // Mouth
  if (isRed) {
    // Evil grin
    ctx.strokeStyle = '#660000'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, -s*0.12, s*0.08, 0.3, Math.PI-0.3); ctx.stroke();
    // Fangs
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(-s*0.04, -s*0.1); ctx.lineTo(-s*0.02, -s*0.04); ctx.lineTo(0, -s*0.1); ctx.fill();
    ctx.beginPath(); ctx.moveTo(s*0.04, -s*0.1); ctx.lineTo(s*0.02, -s*0.04); ctx.lineTo(0, -s*0.1); ctx.fill();
  } else {
    ctx.strokeStyle = '#2a5a8a'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, -s*0.14, s*0.06, 0.2, Math.PI-0.2); ctx.stroke();
  }

  // Arms (tiny)
  ctx.fillStyle = bodyColor;
  const aw = Math.sin(animFrame * 0.25 + e.phase) * 0.3;
  ctx.save(); ctx.translate(-s*0.28, s*0.0); ctx.rotate(-0.4+aw);
  ctx.beginPath(); ctx.ellipse(0, 0, s*0.06, s*0.12, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(s*0.28, s*0.0); ctx.rotate(0.4-aw);
  ctx.beginPath(); ctx.ellipse(0, 0, s*0.06, s*0.12, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();

  // Legs (tiny)
  ctx.fillStyle = bodyColor;
  const legBounce = Math.sin(animFrame * 0.2 + e.phase) * 2;
  ctx.beginPath(); ctx.ellipse(-s*0.1, s*0.4+legBounce, s*0.07, s*0.06, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s*0.1, s*0.4-legBounce, s*0.07, s*0.06, 0, 0, Math.PI*2); ctx.fill();

  // Devil tail
  if (isRed) {
    ctx.strokeStyle = '#880000'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, s*0.35);
    ctx.quadraticCurveTo(s*0.25, s*0.5, s*0.15, s*0.6);
    ctx.stroke();
    // Arrow tip
    ctx.fillStyle = '#880000';
    ctx.beginPath();
    ctx.moveTo(s*0.15, s*0.6);
    ctx.lineTo(s*0.22, s*0.55);
    ctx.lineTo(s*0.2, s*0.65);
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
}

// ============ DRAW BOMB ============
function drawBomb(b) {
  const sx = b.x - cameraX, sy = b.y - cameraY;
  if (sx < -40 || sx > canvas.width+40 || sy < -40 || sy > canvas.height+40) return;
  const s = BOMB_SIZE;
  const pulse = 1 + Math.sin(animFrame * 0.2) * 0.08;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(pulse, pulse);

  // Glow
  ctx.shadowColor = 'rgba(255, 160, 0, 0.6)';
  ctx.shadowBlur = 18 + Math.sin(animFrame * 0.15) * 8;

  // Bomb body
  ctx.fillStyle = '#2a2a2a';
  ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI*2); ctx.fill();

  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;

  // Highlight
  ctx.fillStyle = '#4a4a4a';
  ctx.beginPath(); ctx.arc(-s*0.25, -s*0.25, s*0.4, 0, Math.PI*2); ctx.fill();

  // Fuse hole
  ctx.fillStyle = '#555';
  ctx.beginPath(); ctx.ellipse(0, -s*0.85, s*0.2, s*0.12, 0, 0, Math.PI*2); ctx.fill();

  // Fuse
  ctx.strokeStyle = '#8a6a30';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(0, -s*0.85);
  ctx.quadraticCurveTo(s*0.4, -s*1.3, s*0.15, -s*1.5);
  ctx.stroke();

  // Fuse spark
  const sparkSize = 3 + Math.sin(animFrame * 0.3) * 2;
  ctx.fillStyle = '#ffcc00';
  ctx.beginPath(); ctx.arc(s*0.15, -s*1.5, sparkSize, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff6600';
  ctx.beginPath(); ctx.arc(s*0.15, -s*1.5, sparkSize*0.6, 0, Math.PI*2); ctx.fill();
  // Spark particles
  for (let i = 0; i < 3; i++) {
    const angle = animFrame * 0.4 + i * 2.1;
    const dist = sparkSize + 3 + Math.sin(animFrame * 0.5 + i) * 3;
    ctx.fillStyle = i % 2 === 0 ? '#ffaa00' : '#ff4400';
    ctx.beginPath();
    ctx.arc(s*0.15 + Math.cos(angle)*dist, -s*1.5 + Math.sin(angle)*dist, 1.5, 0, Math.PI*2);
    ctx.fill();
  }

  // Skull icon on bomb
  ctx.fillStyle = '#888';
  ctx.font = `${s*0.9}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('💀', 0, s*0.05);

  ctx.restore();
}

// ============ EXPLOSION EFFECT ============
function drawExplosion() {
  if (!explosion) return;
  const elapsed = Date.now() - explosion.startTime;
  const duration = explosion.duration;
  const progress = Math.min(elapsed / duration, 1);

  if (progress >= 1) { explosion = null; return; }

  // Phase 1: white flash (0-15%)
  // Phase 2: expanding fireball (15-60%)
  // Phase 3: fade out (60-100%)

  ctx.save();

  if (progress < 0.15) {
    // White flash
    const alpha = Math.min(1, progress / 0.08);
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.8})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else if (progress < 0.6) {
    const p = (progress - 0.15) / 0.45;
    // Orange/red fireball expanding from center
    const cx = explosion.x - cameraX;
    const cy = explosion.y - cameraY;
    const maxR = Math.max(canvas.width, canvas.height) * 1.2;
    const r = maxR * easeOutCubic(p);

    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    const alpha = 1 - p * 0.5;
    grad.addColorStop(0, `rgba(255, 255, 200, ${alpha})`);
    grad.addColorStop(0.2, `rgba(255, 180, 50, ${alpha})`);
    grad.addColorStop(0.5, `rgba(255, 80, 20, ${alpha * 0.8})`);
    grad.addColorStop(0.8, `rgba(180, 30, 0, ${alpha * 0.5})`);
    grad.addColorStop(1, `rgba(60, 10, 0, 0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Screen shake effect via translation
    if (p < 0.5) {
      const shake = (1 - p * 2) * 12;
      ctx.translate(Math.sin(elapsed * 0.05) * shake, Math.cos(elapsed * 0.07) * shake);
    }
  } else {
    // Fade out smoke
    const p = (progress - 0.6) / 0.4;
    const alpha = (1 - p) * 0.4;
    ctx.fillStyle = `rgba(40, 20, 0, ${alpha})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // "BOOM!" text during peak
  if (progress > 0.1 && progress < 0.5) {
    const textAlpha = progress < 0.3 ? (progress - 0.1) / 0.2 : (0.5 - progress) / 0.2;
    const textScale = 1 + easeOutCubic(Math.min(1, (progress - 0.1) / 0.15)) * 0.5;
    ctx.save();
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.scale(textScale, textScale);
    ctx.font = "bold 72px 'Fredoka One', cursive";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = `rgba(255, 255, 255, ${textAlpha})`;
    ctx.strokeStyle = `rgba(255, 100, 0, ${textAlpha})`;
    ctx.lineWidth = 4;
    ctx.strokeText('BOOM!', 0, 0);
    ctx.fillText('BOOM!', 0, 0);
    ctx.restore();
  }

  ctx.restore();
}

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

function triggerExplosion(bx, by) {
  explosion = { startTime: Date.now(), duration: 1500, x: bx, y: by };
  // Kill ALL enemies
  const killed = enemies.length;
  killCount += killed;
  score += killed * 50;
  enemies = [];
  state = 'exploding';
  setTimeout(() => {
    if (state === 'exploding') state = 'playing';
  }, 1500);
}

function spawnBomb() {
  // Spawn in random position within the world, but not too close to player
  let x, y, attempts = 0;
  do {
    x = 100 + Math.random() * (WORLD_W - 200);
    y = 100 + Math.random() * (WORLD_H - 200);
    attempts++;
  } while (attempts < 20 && Math.sqrt((x-player.x)**2 + (y-player.y)**2) < 300);
  bombs.push({ x, y });
}

// ============ JOYSTICK ============
function getJoystickCenter() {
  const rect = joystickBase.getBoundingClientRect();
  return { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
}
function handleJoystickMove(cx, cy) {
  const center = getJoystickCenter();
  const dx = cx - center.x, dy = cy - center.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const maxDist = 38;
  const clampDist = Math.min(dist, maxDist);
  const angle = Math.atan2(dy, dx);
  joystickKnob.style.transform = `translate(${Math.cos(angle)*clampDist}px, ${Math.sin(angle)*clampDist}px)`;
  if (dist > 8) { joystickDir.x = dx/dist; joystickDir.y = dy/dist; joystickActive = true; }
  else { joystickDir.x = 0; joystickDir.y = 0; joystickActive = false; }
}
function resetJoystick() {
  joystickKnob.style.transform = 'translate(0,0)';
  joystickDir.x = 0; joystickDir.y = 0;
  joystickActive = false; joystickTouchId = null;
}

joystickZone.addEventListener('touchstart', (e) => {
  if (state !== 'playing') return;
  e.preventDefault();
  const t = e.changedTouches[0];
  joystickTouchId = t.identifier;
  handleJoystickMove(t.clientX, t.clientY);
}, { passive: false });
window.addEventListener('touchmove', (e) => {
  if (state !== 'playing' || joystickTouchId === null) return;
  for (const t of e.changedTouches) {
    if (t.identifier === joystickTouchId) { e.preventDefault(); handleJoystickMove(t.clientX, t.clientY); break; }
  }
}, { passive: false });
window.addEventListener('touchend', (e) => {
  for (const t of e.changedTouches) { if (t.identifier === joystickTouchId) { resetJoystick(); break; } }
});

const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// ============ QUIZ ============
function showQuiz(enemy) {
  state = 'quiz';
  currentEnemy = enemy;
  quizFeedback.textContent = '';

  const isRed = enemy.type === 'red';

  if (isRed) {
    quizBox.classList.add('red-enemy');
    quizLabel.textContent = '😈 小惡魔來襲 — 兩位數加法！';
    quizLabel.style.color = '#ff6666';
  } else {
    quizBox.classList.remove('red-enemy');
    quizLabel.textContent = '🔵 小乐明搗蛋 — 一位數加減法';
    quizLabel.style.color = '#66aaff';
  }

  let a, b, answer;
  if (isRed) {
    a = Math.floor(Math.random() * 50) + 1;
    b = Math.floor(Math.random() * 50) + 1;
    answer = a + b;
    quizQuestion.textContent = `${a} + ${b} = ?`;
  } else {
    const isAdd = Math.random() < 0.5;
    if (isAdd) {
      a = Math.floor(Math.random() * 9) + 1;
      b = Math.floor(Math.random() * 9) + 1;
      answer = a + b;
      quizQuestion.textContent = `${a} + ${b} = ?`;
    } else {
      answer = Math.floor(Math.random() * 9);
      b = Math.floor(Math.random() * 9) + 1;
      a = answer + b;
      quizQuestion.textContent = `${a} − ${b} = ?`;
    }
  }
  quizAnswer = answer;

  const choices = new Set([answer]);
  const spread = isRed ? 15 : 5;
  while (choices.size < 6) {
    let wrong = answer + (Math.floor(Math.random() * (spread*2+1)) - spread);
    if (wrong < 0) wrong = Math.floor(Math.random() * (isRed ? 100 : 18));
    if (wrong !== answer) choices.add(wrong);
  }
  const sorted = [...choices].sort(() => Math.random() - 0.5);

  quizAnswers.innerHTML = '';
  for (const c of sorted) {
    const btn = document.createElement('button');
    btn.className = 'quiz-btn';
    btn.textContent = c;
    btn.addEventListener('click', () => handleAnswer(c, btn));
    quizAnswers.appendChild(btn);
  }
  quizOverlay.classList.add('active');
}

function handleAnswer(chosen, btn) {
  const allBtns = quizAnswers.querySelectorAll('.quiz-btn');
  allBtns.forEach(b => b.style.pointerEvents = 'none');

  const isRed = currentEnemy && currentEnemy.type === 'red';
  const points = isRed ? 200 : 100;

  if (chosen === quizAnswer) {
    btn.classList.add('correct');
    quizFeedback.textContent = isRed ? '🔥 太強了！+200' : '✨ 答對了！+100';
    quizFeedback.style.color = '#2ecc71';
    score += points;
    killCount++;
    const idx = enemies.indexOf(currentEnemy);
    if (idx > -1) enemies.splice(idx, 1);
    knockbackEnemies(player.x, player.y, 200);
    setTimeout(closeQuiz, 600);
  } else {
    btn.classList.add('wrong');
    allBtns.forEach(b => { if (parseInt(b.textContent) === quizAnswer) b.classList.add('correct'); });
    quizFeedback.textContent = '💔 答錯了！';
    quizFeedback.style.color = '#e74c3c';
    hearts--;
    updateHearts();
    knockbackEnemies(player.x, player.y, 150);
    if (hearts <= 0) { setTimeout(() => { closeQuiz(); gameOver(); }, 800); }
    else { setTimeout(closeQuiz, 800); }
  }
}

// Push nearby enemies away from a point (animated via knockback velocity)
function knockbackEnemies(fromX, fromY, radius) {
  const KNOCKBACK_FORCE = 18;
  for (const e of enemies) {
    const dx = e.x - fromX;
    const dy = e.y - fromY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < radius && dist > 0) {
      const strength = 1 - (dist / radius);
      const force = KNOCKBACK_FORCE * strength;
      const nx = dx / dist;
      const ny = dy / dist;
      // Set knockback velocity — this gets applied each frame and decays
      e.kbVx = nx * force;
      e.kbVy = ny * force;
      // Prevent normal AI from overriding immediately
      if (e.type !== 'red') e.changeTimer = 1500;
    }
  }
}

function closeQuiz() {
  quizOverlay.classList.remove('active');
  quizBox.classList.remove('red-enemy');
  quizBox.classList.remove('bomb-quiz');
  currentEnemy = null;
  currentBomb = null;
  if (hearts > 0) state = 'playing';
}

// ============ BOMB QUIZ ============
function showBombQuiz(bomb, bombIndex) {
  state = 'quiz';
  currentBomb = { bomb, index: bombIndex };
  currentEnemy = null;
  quizFeedback.textContent = '';

  quizBox.classList.remove('red-enemy');
  quizBox.classList.add('bomb-quiz');

  generateBombQuestion();

}

function generateBombQuestion() {
  const a = Math.floor(Math.random() * 300) + 1;
  const b = Math.floor(Math.random() * 300) + 1;
  const answer = a + b;
  quizQuestion.textContent = `${a} + ${b} = ?`;
  bombQuizAnswer = answer;

  const choices = new Set([answer]);
  while (choices.size < 6) {
    let wrong = answer + (Math.floor(Math.random() * 61) - 30);
    if (wrong < 0) wrong = Math.floor(Math.random() * 600);
    if (wrong !== answer) choices.add(wrong);
  }
  const sorted = [...choices].sort(() => Math.random() - 0.5);

  quizAnswers.innerHTML = '';
  for (const c of sorted) {
    const btn = document.createElement('button');

    btn.textContent = c;

function handleBombAnswer(chosen, btn) {
  const allBtns = quizAnswers.querySelectorAll('.quiz-btn');
  allBtns.forEach(b => b.style.pointerEvents = 'none');

  if (chosen === bombQuizAnswer) {
    btn.classList.add('correct');
    quizFeedback.textContent = '💥 引爆成功！！';
    quizFeedback.style.color = '#ffaa00';
    // Remove bomb and explode
    const b = currentBomb.bomb;
    const idx = bombs.indexOf(b);
    if (idx > -1) bombs.splice(idx, 1);
    setTimeout(() => {
      quizOverlay.classList.remove('active');
      quizBox.classList.remove('bomb-quiz');
      currentBomb = null;
      triggerExplosion(b.x, b.y);
    }, 500);
  } else {
    btn.classList.add('wrong');
    quizFeedback.textContent = '再試一次！';
    quizFeedback.style.color = '#ffaa00';
    // Generate a new question after a short delay
    setTimeout(() => {
      quizFeedback.textContent = '';
      generateBombQuestion();
    }, 800);
  }
}

function updateHearts() {
  hudHearts.textContent = '❤️'.repeat(hearts) + '🖤'.repeat(3 - hearts);
}

// ============ SPAWNING ============
function getRedChance() {
  const minute = Math.floor(survivalTime / 60);
  return RED_SCHEDULE[Math.min(minute, RED_SCHEDULE.length - 1)];
}

function spawnEnemy() {
  const margin = 100;
  let x, y;
  const side = Math.floor(Math.random() * 4);
  if (side === 0) { x = cameraX - margin; y = cameraY + Math.random() * canvas.height; }
  else if (side === 1) { x = cameraX + canvas.width + margin; y = cameraY + Math.random() * canvas.height; }
  else if (side === 2) { x = cameraX + Math.random() * canvas.width; y = cameraY - margin; }
  else { x = cameraX + Math.random() * canvas.width; y = cameraY + canvas.height + margin; }
  x = Math.max(30, Math.min(WORLD_W - 30, x));
  y = Math.max(30, Math.min(WORLD_H - 30, y));

  const isRed = Math.random() < getRedChance();
  enemies.push({
    x, y,
    type: isRed ? 'red' : 'green',
    vx: (Math.random() - 0.5) * 2,
    vy: (Math.random() - 0.5) * 2,
    speed: isRed ? RED_ENEMY_SPEED + Math.random() * 0.5 : ENEMY_SPEED_BASE + Math.random() * 0.8,
    changeTimer: 0,
    phase: Math.random() * Math.PI * 2,
    kbVx: 0, kbVy: 0
  });
}

// ============ GAME LOGIC ============
function updatePlaying(dt) {
  animFrame++;

  let mx = joystickDir.x, my = joystickDir.y;
  if (!joystickActive) {
    if (keys['ArrowLeft'] || keys['a']) mx = -1;
    if (keys['ArrowRight'] || keys['d']) mx = 1;
    if (keys['ArrowUp'] || keys['w']) my = -1;
    if (keys['ArrowDown'] || keys['s']) my = 1;
    const len = Math.sqrt(mx*mx + my*my);
    if (len > 0) { mx /= len; my /= len; }
  }

  player.x += mx * PLAYER_SPEED;
  player.y += my * PLAYER_SPEED;
  player.x = Math.max(PLAYER_SIZE/2, Math.min(WORLD_W - PLAYER_SIZE/2, player.x));
  player.y = Math.max(PLAYER_SIZE/2, Math.min(WORLD_H - PLAYER_SIZE/2, player.y));
  if (mx !== 0) player.dir = mx > 0 ? 1 : -1;

  cameraX = player.x - canvas.width / 2;
  cameraY = player.y - canvas.height / 2;
  cameraX = Math.max(0, Math.min(WORLD_W - canvas.width, cameraX));
  cameraY = Math.max(0, Math.min(WORLD_H - canvas.height, cameraY));

  const now = Date.now();
  if (now - lastSpawn > spawnInterval) {
    spawnEnemy();
    lastSpawn = now;
    spawnInterval = Math.max(SPAWN_INTERVAL_MIN, spawnInterval * SPAWN_RAMP);
  }

  for (const e of enemies) {
    // Knockback decay
    if (e.kbVx || e.kbVy) {
      e.x += e.kbVx;
      e.y += e.kbVy;
      // Friction: decay knockback velocity
      e.kbVx *= 0.88;
      e.kbVy *= 0.88;
      // Stop when negligible
      if (Math.abs(e.kbVx) < 0.1 && Math.abs(e.kbVy) < 0.1) {
        e.kbVx = 0; e.kbVy = 0;
      }
    }

    // Normal AI movement (reduced while being knocked back)
    const kbStrength = Math.sqrt((e.kbVx||0)**2 + (e.kbVy||0)**2);
    const aiScale = kbStrength > 1 ? 0.2 : 1; // suppress AI while flying back

    if (e.type === 'red') {
      const dx = player.x - e.x, dy = player.y - e.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 1) { e.vx = dx / dist; e.vy = dy / dist; }
    } else {
      e.changeTimer -= dt;
      if (e.changeTimer <= 0) {
        e.vx = (Math.random() - 0.5) * 2;
        e.vy = (Math.random() - 0.5) * 2;
        e.changeTimer = 1000 + Math.random() * 2000;
      }
    }
    e.x += e.vx * e.speed * aiScale;
    e.y += e.vy * e.speed * aiScale;
    if (e.x < 30 || e.x > WORLD_W - 30) { e.vx *= -1; e.kbVx = (e.kbVx||0) * -0.5; }
    if (e.y < 30 || e.y > WORLD_H - 30) { e.vy *= -1; e.kbVy = (e.kbVy||0) * -0.5; }
    e.x = Math.max(30, Math.min(WORLD_W - 30, e.x));
    e.y = Math.max(30, Math.min(WORLD_H - 30, e.y));
  }

  for (const e of enemies) {
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < (PLAYER_SIZE + ENEMY_SIZE) / 2 * 0.75) {
      showQuiz(e);
      break;
    }
  }

  // Bomb spawning
  if (!firstBombSpawned && survivalTime >= BOMB_FIRST_DELAY / 1000) {
    spawnBomb();
    firstBombSpawned = true;
    lastBombSpawn = now;
  } else if (firstBombSpawned && now - lastBombSpawn >= BOMB_INTERVAL) {
    spawnBomb();
    lastBombSpawn = now;
  }

  // Bomb collision
  for (let i = bombs.length - 1; i >= 0; i--) {
    const b = bombs[i];
    const dx = player.x - b.x, dy = player.y - b.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < (PLAYER_SIZE/2 + BOMB_SIZE) * 0.8) {
      showBombQuiz(b, i);
      break;
    }
  }

  survivalTime = (now - startTime) / 1000;
  score = killCount * 100 + Math.floor(survivalTime);
  scoreValue.textContent = score;
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawMap();
  for (const b of bombs) drawBomb(b);
  for (const e of enemies) { if (e.type === 'green') drawLemming(e); }
  for (const e of enemies) { if (e.type === 'red') drawLemming(e); }
  drawGrizzy(player.x, player.y, PLAYER_SIZE, player.dir);
  drawExplosion();
}

let lastTime = 0;
function loop(ts) {
  const dt = ts - lastTime;
  lastTime = ts;
  if (state === 'playing') updatePlaying(dt);
  if (state === 'playing' || state === 'quiz' || state === 'exploding') render();
  requestAnimationFrame(loop);
}

function startGame() {
  player = { x: WORLD_W/2, y: WORLD_H/2, dir: 0 };
  enemies = [];
  bombs = [];
  explosion = null;
  firstBombSpawned = false;
  lastBombSpawn = 0;
  hearts = 3; score = 0; killCount = 0;
  spawnInterval = SPAWN_INTERVAL_START;
  startTime = Date.now(); lastSpawn = Date.now();
  survivalTime = 0; animFrame = 0;
  updateHearts();
  scoreValue.textContent = '0';
  for (let i = 0; i < 4; i++) spawnEnemy();
  screenOverlay.classList.add('hidden');
  state = 'playing';
}

function gameOver() {
  state = 'gameover';
  screenTitle.textContent = 'Game Over';
  screenSubtitle.textContent = '';
  screenStats.innerHTML = `
    <span class="big">${score}</span>
    存活 ${Math.floor(survivalTime)} 秒 ｜ 趕走 ${killCount} 隻小乐明
  `;
  startBtn.textContent = '再玩一次';
  screenOverlay.classList.remove('hidden');
}

startBtn.addEventListener('click', startGame);
document.addEventListener('touchmove', e => {
  if (state === 'playing' || state === 'quiz') e.preventDefault();
}, { passive: false });

requestAnimationFrame(loop);
</script>
</body>
</html>
